name: mise 14936 source patch preflight

on:
  push:
    branches:
      - ci/doctor-14936-preflight

permissions:
  contents: read

concurrency:
  group: mise-14936-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'Aschenbath/mise'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "1"
      MBX_DISABLE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUST_TEST_THREADS: "1"
      RUSTUP_TOOLCHAIN: stable
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_EXPERIMENTAL: "1"
      MISE_LOCKFILE: "1"
      MISE_LOCKED: "1"
      EXPECTED_BASE_SHA: 269420244d45ec6ff479b22d7db6259b3fd77c77
      EXPECTED_PATCH_SHA256: 6ec7d8afc4443fd4a052e467e6c787cf9338e175e848c1d9a376851fd730b1e3
      EXPECTED_SOURCE_TREE: 49d806edde9eb92ed444f9498f3b41ef01c47ec1
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the fixed source base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 269420244d45ec6ff479b22d7db6259b3fd77c77
          persist-credentials: false

      - name: Apply and verify the proposed source patch
        id: apply_patch
        env:
          PATCH_B64: ${{ vars.MISE_14936_PATCH_B64 }}
          PATCH_SHA_VARIABLE: ${{ vars.MISE_14936_PATCH_SHA256 }}
          TREE_VARIABLE: ${{ vars.MISE_14936_TARGET_TREE }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import binascii
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          base = os.environ["EXPECTED_BASE_SHA"]
          patch_sha = os.environ["EXPECTED_PATCH_SHA256"]
          expected_tree = os.environ["EXPECTED_SOURCE_TREE"]
          if git("rev-parse", "HEAD") != base:
              raise SystemExit("The checkout is not the fixed source base")
          if os.environ.get("PATCH_SHA_VARIABLE", "") not in ("", patch_sha):
              raise SystemExit("The patch SHA variable differs from the workflow's fixed SHA")
          if os.environ.get("TREE_VARIABLE", "") not in ("", expected_tree):
              raise SystemExit("The tree variable differs from the workflow's fixed tree")
          encoded = os.environ.get("PATCH_B64", "")
          if not encoded:
              raise SystemExit("MISE_14936_PATCH_B64 is missing")
          try:
              patch = base64.b64decode(encoded, validate=True)
          except (binascii.Error, ValueError):
              raise SystemExit("The source patch is not valid base64")
          if hashlib.sha256(patch).hexdigest() != patch_sha:
              raise SystemExit("The decoded source patch does not match the fixed SHA-256")
          patch_file = Path(os.environ["RUNNER_TEMP"]) / "mise-14936-proposed.patch"
          patch_file.write_bytes(patch)
          patch_file.chmod(0o600)
          allowed = {
              "src/cli/doctor/mod.rs",
              "docs/dev-tools/backends/index.md",
              "e2e/cli/test_doctor_explicit_backends",
          }
          statistics = subprocess.check_output(
              ["git", "apply", "--numstat", str(patch_file)], text=True
          )
          paths = {line.split("\t", 2)[2] for line in statistics.splitlines()}
          if paths != allowed:
              raise SystemExit("The patch does not contain exactly the three approved source paths")
          subprocess.run(["git", "apply", "--check", "--whitespace=error-all", str(patch_file)], check=True)
          subprocess.run(["git", "apply", "--whitespace=error-all", str(patch_file)], check=True)
          subprocess.run(["git", "add", "--", *sorted(allowed)], check=True)
          actual_tree = git("write-tree")
          if actual_tree != expected_tree:
              raise SystemExit(f"Applied source tree mismatch: {actual_tree}")
          print(f"Verified source base: {base}")
          print(f"Verified patch SHA-256: {patch_sha}")
          print(f"Verified source tree: {actual_tree}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tree={actual_tree}\n")
          PY
          cat > "$RUNNER_TEMP/check-mise-source.py" <<'PY'
          import os
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          if git("rev-parse", "HEAD") != os.environ["EXPECTED_BASE_SHA"]:
              raise SystemExit("The source base changed during verification")
          tree = git("write-tree")
          if tree != os.environ["EXPECTED_SOURCE_TREE"]:
              subprocess.run(["git", "diff", "--stat", os.environ["EXPECTED_SOURCE_TREE"], tree], check=True)
              raise SystemExit(f"The staged source tree changed during verification: {tree}")
          if subprocess.run(["git", "diff", "--quiet", "--"]).returncode != 0:
              subprocess.run(["git", "diff", "--stat", "--"], check=True)
              subprocess.run(["git", "diff", "--", "src/cli/doctor/mod.rs",
                              "docs/dev-tools/backends/index.md",
                              "e2e/cli/test_doctor_explicit_backends"], check=True)
              raise SystemExit("A check changed tracked source files")
          untracked = git("ls-files", "--others", "--exclude-standard")
          if untracked:
              print(untracked)
              raise SystemExit("A check created untracked source files")
          print(f"Source tree remains unchanged: {tree}")
          PY
          python3 "$RUNNER_TEMP/check-mise-source.py"

      # The original lint host relies on runner-provided Rust/native tools.
      # This independent preflight makes those prerequisites explicit.
      - name: Install native build prerequisites on the runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev cmake pkg-config libssl-dev

      - name: Install latest stable Rust with rustfmt and Clippy
        id: rust_setup
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustc --version
          printf 'version=%s\n' "$(rustc --version)" >> "$GITHUB_OUTPUT"
          cargo --version
          cargo clippy --version
          clang --version
          cmake --version
          pkg-config --modversion openssl
          df -h "$GITHUB_WORKSPACE"

      - name: Install locked repository tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install locked documentation and lint dependencies
        run: mise x -- aube install --frozen-lockfile

      - name: Run the required repository lint fix
        id: lint_fix
        run: |
          unset GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GITHUB_API_TOKEN
          mise run lint-fix

      - name: Verify lint fix left the proposed source unchanged
        id: tree_after_lint
        run: python3 "$RUNNER_TEMP/check-mise-source.py"

      - name: Run exact workspace all-feature all-target Clippy
        id: clippy
        run: |
          unset GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GITHUB_API_TOKEN
          cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Verify Clippy left the proposed source unchanged
        id: tree_after_clippy
        run: python3 "$RUNNER_TEMP/check-mise-source.py"

      - name: Build documentation without publishing
        id: docs_build
        run: |
          unset GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GITHUB_API_TOKEN
          mise run docs:build

      - name: Verify documentation build left the proposed source unchanged
        id: tree_after_docs
        run: python3 "$RUNNER_TEMP/check-mise-source.py"

      - name: Record preflight identities and completed checks
        if: always()
        env:
          RUST_VERSION: ${{ steps.rust_setup.outputs.version }}
          APPLY_RESULT: ${{ steps.apply_patch.outcome }}
          LINT_RESULT: ${{ steps.lint_fix.outcome }}
          LINT_TREE_RESULT: ${{ steps.tree_after_lint.outcome }}
          CLIPPY_RESULT: ${{ steps.clippy.outcome }}
          CLIPPY_TREE_RESULT: ${{ steps.tree_after_clippy.outcome }}
          DOCS_RESULT: ${{ steps.docs_build.outcome }}
          DOCS_TREE_RESULT: ${{ steps.tree_after_docs.outcome }}
        run: |
          actual_tree=$(git write-tree 2>/dev/null || true)
          {
            printf '## mise 14936 preflight\n\n'
            printf '| Identity or check | Value |\n| --- | --- |\n'
            printf '| CI-only workflow commit | `%s` |\n' "$GITHUB_SHA"
            printf '| Fixed source base | `%s` |\n' "$EXPECTED_BASE_SHA"
            printf '| Fixed patch SHA-256 | `%s` |\n' "$EXPECTED_PATCH_SHA256"
            printf '| Expected source tree | `%s` |\n' "$EXPECTED_SOURCE_TREE"
            printf '| Actual workspace index tree | `%s` |\n' "${actual_tree:-unavailable}"
            printf '| Actual stable Rust toolchain | `%s` |\n' "${RUST_VERSION:-not-run}"
            printf '| Patch application and tree check | %s |\n' "${APPLY_RESULT:-not-run}"
            printf '| mise run lint-fix | %s |\n' "${LINT_RESULT:-not-run}"
            printf '| Source unchanged after lint fix | %s |\n' "${LINT_TREE_RESULT:-not-run}"
            printf '| Exact required Clippy | %s |\n' "${CLIPPY_RESULT:-not-run}"
            printf '| Source unchanged after Clippy | %s |\n' "${CLIPPY_TREE_RESULT:-not-run}"
            printf '| Documentation build | %s |\n' "${DOCS_RESULT:-not-run}"
            printf '| Source unchanged after docs build | %s |\n' "${DOCS_TREE_RESULT:-not-run}"
          } >> "$GITHUB_STEP_SUMMARY"
